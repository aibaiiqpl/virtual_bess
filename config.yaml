modbus:
  address: ":502"
  # 非空时额外开一个 RTU over TCP 端口（串口服务器/透传网关模拟），
  # 与上面的 MBAP 端口共用同一份寄存器区；联调 emu-rs 的 rtu_tcp 端口类型时打开。
  rtu_over_tcp_address: ""

iec61850:
  enabled: false
  address: ":102"
  ied_name: ""
  goose:
    enabled: false
    interface: ""
    appid: "0100"
    dst_mac: "01-0C-CD-01-01-00"
    vlan_priority: 4
    vlan_id: 0
    disable_vlan: false
    interval_ms: 1000
    time_allowed_to_live_ms: 5000
  devices:
    - pcs_slave_id: 1
      address: ":102"
      ied_name: "pcs01"

# 日本大阪场景：60Hz 电网，单柜 2000kW。
grid:
  # 关口表所在侧"相电压" V。现场关口电压等级 6.6kV 为线电压，
  # 仿真寄存器统一写相电压：6600 / √3 ≈ 3810.5 V。
  voltage: 3810.5
  frequency: 60                # 大阪属日本西部，标称频率 60Hz

pcs:
  # PCS AC 出口"相电压" V。现场 PCS 电压等级 480V 为线电压，
  # 仿真寄存器统一写相电压：480 / √3 ≈ 277.1 V。
  # 取标称值而非偏低值：真实工况围绕额定小幅波动，轻载略高、满功率放电略低。
  ac_voltage: 277.1

# 单套储能柜：1 PCS（2000kW）+ 1 BMS（20 簇并联，5016kWh，约 0.4C / 2.5h），无光伏。
# battery_voltage_full=1382 → 串数 round(1382/3.6)=384，单体≈3.3V 时 pack≈1267V，
# 对齐现场 BMS（单体 3.3V / 总电压 1268V）。每簇并联，簇电压≈pack 电压。
battery_units:
  - pcs_slave_id: 1
    bms_slave_id: 11
    rated_capacity_kwh: 5016
    rated_power_kw: 2000
    initial_soc: 30.0
    soh: 100.0
    battery_voltage_full: 1382
    cluster_count: 20

# 无光伏：必须显式置空。LoadConfig 以 DefaultConfig 为基底再 yaml.Unmarshal，
# 缺省 pv_units 键时不会清空默认值（默认含 1 台 PV slave 21），故须显式 []。
pv_units: []

# 站用/辅助负荷：辅助电表后挂的小负载（空调、热管理、控制电源等），约十几千瓦。
loads:
  - name: aux
    rated_power_kw: 16

# 空调：每台设备使用独立 Modbus slave。单柜各保留一台，
# 风冷采用 AC-P-heidun.csv 的源寄存器布局；液冷采用 LC-tongfei.csv 的源寄存器布局，
# 两种都留是为了同时覆盖两套协议的解析验证。
# 启动后状态机根据室内温度、制冷/制热设定及回差自动切换制冷、制热、待机。
ac_units:
  - slave_id: 41
    name: ac-1
    indoor_temperature: 30
    ambient_temperature: 32
    cooling_setpoint: 25
    heating_setpoint: 15
    cooling_differential: 2
    heating_differential: 2

lc_units:
  - slave_id: 51
    name: lc-1
    indoor_temperature: 30
    ambient_temperature: 32
    cooling_setpoint: 25
    heating_setpoint: 15
    cooling_differential: 2
    heating_differential: 2

# 电表：
#   - 31 main：6.6kV 关口表（PCC），is_main 聚合全部 PCS + 站用辅助负荷。
#   - 32 aux ：480V 辅助/站用电表，本质是负载电表，计量站用辅助负荷 aux。
# 电压统一写相电压（线电压 / √3），pt_ratio=1 时寄存器即一次相电压（0.1V）。
meters:
  - slave_id: 31
    name: main
    is_main: true             # 关口表，聚合全部 PCS + 负荷
    voltage: 3810.5           # 6.6kV 线电压 → 相电压 3810.5V
    pt_ratio: 1
  - slave_id: 32
    name: aux                 # 辅助/站用电表（≈ 负载电表，计量站用辅助负荷）
    load_names: [aux]
    voltage: 277.1            # 480V 线电压 → 相电压 277.1V
    pt_ratio: 1

log:
  file: "logs/virtual_bess.log"
  level: "info"
  console: true

# 持久化：电表 forward/reverse 电度、电池 SOC/总充总放。
state:
  file: "state.json"
  interval: 15

timezone: "Asia/Tokyo"
