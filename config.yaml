modbus:
  address: ":502"
  # 非空时额外开一个 RTU over TCP 端口（串口服务器/透传网关模拟），
  # 与上面的 MBAP 端口共用同一份寄存器区；联调 emu-rs 的 rtu_tcp 端口类型时打开。
  rtu_over_tcp_address: ""

iec61850:
  enabled: false
  address: ":102"
  ied_name: ""
  goose:
    enabled: false
    interface: ""
    appid: "0100"
    dst_mac: "01-0C-CD-01-01-00"
    vlan_priority: 4
    vlan_id: 0
    disable_vlan: false
    interval_ms: 1000
    time_allowed_to_live_ms: 5000
  devices:
    - pcs_slave_id: 1
      address: ":102"
      ied_name: "pcs01"

# 日本大阪场景：60Hz 电网，单柜 2000kW。
grid:
  # 关口表所在侧"相电压" V。现场关口电压等级 6.6kV 为线电压，
  # 仿真寄存器统一写相电压：6600 / √3 ≈ 3810.5 V。
  voltage: 3810.5
  frequency: 60                # 大阪属日本西部，标称频率 60Hz
  # 并网点等效阻抗：站内净潮流经它换算成关口电压偏移。
  # 买电（充电/带负载）压低电压，卖电（放电/光伏倒送）抬高电压；
  # 感性无功压低、容性无功抬高。留空则套用默认值。
  coupling:
    base_kva: 0                # 0 = 站内 PCS 额定容量之和
    resistance_pu: 0.010
    reactance_pu: 0.040
    response_seconds: 3

pcs:
  # PCS AC 出口"相电压" V。现场 PCS 电压等级 480V 为线电压，
  # 仿真寄存器统一写相电压：480 / √3 ≈ 277.1 V。
  # 取标称值而非偏低值：真实工况围绕额定小幅波动，轻载略高、满功率放电略低。
  ac_voltage: 277.1
  # PCS 出口母线等效阻抗，同时是 Q-U 下垂的反馈通道：
  # 没有它，Q-U 模式下电压恒等于额定值、下垂永不动作。
  # response_seconds 必须 > 0，否则该闭环会在相邻 tick 之间自激。
  coupling:
    base_kva: 0                # 0 = 本单元 rated_power_kw
    resistance_pu: 0.015
    reactance_pu: 0.060
    response_seconds: 2

# 单套储能柜：1 PCS（2000kW）+ 1 BMS（20 簇并联，5016kWh，约 0.4C / 2.5h），无光伏。
# battery_voltage_full=1382 → 串数 round(1382/3.6)=384，单体≈3.3V 时 pack≈1267V，
# 对齐现场 BMS（单体 3.3V / 总电压 1268V）。每簇并联，簇电压≈pack 电压。
battery_units:
  - pcs_slave_id: 1
    bms_slave_id: 11
    rated_capacity_kwh: 5016
    rated_power_kw: 2000
    initial_soc: 30.0
    soh: 100.0
    battery_voltage_full: 1382
    cluster_count: 20

# 无光伏：必须显式置空。LoadConfig 以 DefaultConfig 为基底再 yaml.Unmarshal，
# 缺省 pv_units 键时不会清空默认值（默认含 1 台 PV slave 21），故须显式 []。
pv_units: []

# 无站用负荷：关口表下为纯储能，不接负载。必须显式置空，理由同 pv_units——
# LoadConfig 以 DefaultConfig 为基底 Unmarshal，缺省 loads 键会保留默认的 80kW 负载。
loads: []

# 空调：每台设备使用独立 Modbus slave。单柜各保留一台，
# 风冷采用 AC-P-heidun.csv 的源寄存器布局；液冷采用 LC-tongfei.csv 的源寄存器布局，
# 两种都留是为了同时覆盖两套协议的解析验证。
# 启动后状态机根据室内温度、制冷/制热设定及回差自动切换制冷、制热、待机。
ac_units:
  - slave_id: 41
    name: ac-1
    indoor_temperature: 30
    ambient_temperature: 32
    cooling_setpoint: 25
    heating_setpoint: 15
    cooling_differential: 2
    heating_differential: 2

lc_units:
  - slave_id: 51
    name: lc-1
    indoor_temperature: 30
    ambient_temperature: 32
    cooling_setpoint: 25
    heating_setpoint: 15
    cooling_differential: 2
    heating_differential: 2

# 电表：
#   - 31 main       ：6.6kV 关口表（PCC）。is_main 自动聚合全部 PCS/PV/负荷，
#                     本场景无 PV 也无负荷，故读数即纯储能出力。
#   - 32 BESS-PCC1  ：480V 侧储能并网点表，只聚合 PCS 1，不挂任何负载。
# voltage 一律填一次侧"相电压"（线电压 / √3）；寄存器存的是二次侧值 = 一次值 / pt_ratio。
# 关口表按真实 6.6kV/100V 互感器取 pt_ratio=66，二次相电压 = 3810.5/66 ≈ 57.7V，
# 正是标准 PT 二次值（100V 线电压 / √3）。二级 EMS 侧的 PT 必须同为 66 才能还原，
# 两边不一致就会成倍放大或缩小。480V 侧直接接入，pt_ratio=1。
meters:
  - slave_id: 31
    name: main
    is_main: true             # 关口表，本场景下只聚合 PCS
    voltage: 3810.5           # 6.6kV 线电压 → 相电压 3810.5V
    pt_ratio: 66              # 6600/100 互感器；寄存器存二次值 ≈ 57.7V
  - slave_id: 32
    name: BESS-PCC1           # 储能并网点表（480V 侧），只聚合 PCS，不含负载
    pcs_slave_ids: [1]
    voltage: 277.1            # 480V 线电压 → 相电压 277.1V
    pt_ratio: 1               # 低压侧直接接入

log:
  file: "logs/virtual_bess.log"
  level: "info"
  console: true

# 持久化：电表 forward/reverse 电度、电池 SOC/总充总放。
state:
  file: "state.json"
  interval: 15

timezone: "Asia/Tokyo"
